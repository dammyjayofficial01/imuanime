<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D@mm¥J@¥ - Anime & Manga Portal</title>
    <style>
        /* Global Structural Spacing Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 1. STICKY NAVIGATION HEADER */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid #1a1a1a;
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff3333;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .nav-links a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* 2. HERO COVER DISPLAYS */
        .cover-page {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            padding-top: 60px;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: 540px;
            display: block;
        }

        /* 3. CORE CONTENT SYSTEM CONSOLE */
        .portal-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 60px 20px;
        }

        .section-title {
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 50px;
            margin-bottom: 25px;
            border-left: 4px solid #ff3333;
            padding-left: 15px;
        }

        /* 4. RESPONSIVE GRID MATRIX */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background-color: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s, border-color 0.3s;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff3333;
        }

        .anime-thumb-box {
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            background-color: #222222;
        }

        .anime-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .anime-info {
            padding: 12px;
        }

        .anime-name {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .manga-status {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(255, 51, 51, 0.9);
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }

        .action-btn {
            display: block;
            width: 100%;
            background-color: #ff3333;
            color: #ffffff;
            text-align: center;
            padding: 6px 0;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: #cc0000;
        }

        .read-btn {
            background-color: #1e1e1e;
            border: 1px solid #333333;
        }
        
        .read-btn:hover {
            background-color: #333333;
            border-color: #ff3333;
        }

        /* 5. NEWS LIST SYSTEM LAYOUT */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .news-item {
            display: flex;
            background-color: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff;
            transition: border-color 0.3s, transform 0.2s;
        }

        .news-item:hover {
            border-color: #ff3333;
            transform: scale(1.01);
        }

        .news-img-box {
            width: 100px;
            min-width: 100px;
            aspect-ratio: 1/1;
            background-color: #222222;
        }

        .news-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .news-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .news-tag {
            font-size: 0.65rem;
            color: #ff3333;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .news-heading {
            font-size: 0.95rem;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .news-date {
            font-size: 0.75rem;
            color: #666666;
        }

        /* 6. SYSTEM SITE FOOTER BANNER */
        .footer-banner {
            background-color: #000000;
            border-top: 1px solid #1a1a1a;
            padding: 40px 20px;
            text-align: center;
        }

        .footer-brand {
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .footer-social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .footer-social-links a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #222222;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .footer-social-links a:hover {
            color: #ff3333;
            border-color: #ff3333;
            background-color: #0c0202;
        }

        .footer-copy {
            font-size: 0.75rem;
            color: #444444;
            letter-spacing: 1px;
        }
    </style>
</head>
